<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Love Day</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #d6a3a7;
      font-family: Georgia, serif;
    }

    .card {
      width: 88%;
      max-width: 620px;
      min-height: 650px;
      padding: 45px 35px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,.12);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
      font-style: italic;
      color: #382424;
    }

    .subtitle {
      margin-top: 18px;
      text-align: center;
      font-size: 19px;
      color: #9b6b6d;
    }

    hr {
      margin: 35px 0 80px;
      border: 0;
      border-top: 2px solid #9b6b6d;
    }

    .letter {
      color: #333;
      font-size: 17px;
      line-height: 1.8;
    }

    .letter p {
      margin-bottom: 28px;
    }

    .sign {
      margin-top: 100px;
      text-align: right;
      font-size: 20px;
      font-style: italic;
      color: #8b5b5f;
    }

    button {
      display: block;
      margin: 60px auto 0;
      padding: 16px 55px;
      border: 0;
      border-radius: 12px;
      background: #5d2c2c;
      color: white;
      font-size: 15px;
      letter-spacing: 2px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>For you, Ma Love</h1>

    <div class="subtitle">
      a little something for your birthday
    </div>

    <hr>

    <div class="letter">
      <p>Hi, Ma Love.</p>

      <p>
        I wanted to make something small for your birthday.
        Nothing too complicated, just something you can keep.
      </p>

      <p>
        I hope you have a good day today.
        That's all.
      </p>
    </div>

    <div class="sign">
      from me,
    </div>

    <button onclick="nextPage()">NEXT</button>

  </div>

  <script>
    function nextPage() {
      alert("Coming next...");
    }
  </script>

</body>
</html>
